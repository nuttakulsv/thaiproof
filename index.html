<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>thaiproof · ตรวจภาษาไทยก่อนกดส่ง</title>
<meta name="description" content="ตรวจคำสะกดผิด คำทับศัพท์ตามราชบัณฑิตยสภา คะ/ค่ะ สำนวนแปล และคำที่ฟ้องว่า AI เขียน ทำงานในเบราว์เซอร์ทั้งหมด">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600&family=IBM+Plex+Mono&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #faf8f4; --panel: #ffffff; --ink: #1f1d1a; --muted: #6b665d; --line: #e6e1d8;
    --error: #c2412d; --error-bg: #fbe3dd; --warn: #a86a00; --warn-bg: #fbefd2; --hint: #3d6fa8; --hint-bg: #e2ecf8;
    --accent: #1f1d1a;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #161513; --panel: #1f1e1b; --ink: #ece8e1; --muted: #a39d92; --line: #34322d;
      --error: #f08a74; --error-bg: #4a221b; --warn: #e6b450; --warn-bg: #45351a; --hint: #8db7ea; --hint-bg: #1f3149;
      --accent: #ece8e1;
    }
  }
  :root[data-theme="dark"] {
    --bg: #161513; --panel: #1f1e1b; --ink: #ece8e1; --muted: #a39d92; --line: #34322d;
    --error: #f08a74; --error-bg: #4a221b; --warn: #e6b450; --warn-bg: #45351a; --hint: #8db7ea; --hint-bg: #1f3149;
    --accent: #ece8e1;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.7 "IBM Plex Sans Thai", system-ui, sans-serif; }
  main { max-width: 1120px; margin: 0 auto; padding: 32px 16px 64px; }
  header h1 { margin: 0; font-size: 28px; font-weight: 600; letter-spacing: -0.01em; }
  header p { margin: 4px 0 0; color: var(--muted); }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 24px; }
  @media (max-width: 820px) { .grid { grid-template-columns: 1fr; } }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 16px; min-width: 0; }
  textarea { width: 100%; min-height: 360px; resize: vertical; border: 0; outline: none; background: transparent; color: var(--ink);
    font: inherit; line-height: 1.8; }
  .bar { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--line);
    font-size: 14px; color: var(--muted); }
  button { font: inherit; font-size: 14px; border: 1px solid var(--line); background: transparent; color: var(--ink); border-radius: 8px;
    padding: 4px 12px; cursor: pointer; }
  button:hover { border-color: var(--muted); }
  label { display: inline-flex; gap: 6px; align-items: center; cursor: pointer; }
  .score { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
  .score b { font-size: 24px; font-weight: 600; }
  .score .level-สูง { color: var(--error); } .score .level-กลาง { color: var(--warn); } .score .level-ต่ำ { color: var(--hint); }
  .counts { display: flex; gap: 8px; flex-wrap: wrap; margin: 8px 0 12px; font-size: 14px; }
  .pill { border-radius: 999px; padding: 2px 10px; }
  .pill.error { background: var(--error-bg); color: var(--error); } .pill.warning { background: var(--warn-bg); color: var(--warn); }
  .pill.hint { background: var(--hint-bg); color: var(--hint); }
  .preview { white-space: pre-wrap; overflow-wrap: anywhere; line-height: 1.9; max-height: 260px; overflow: auto; padding: 8px 0;
    border-bottom: 1px solid var(--line); }
  mark { color: inherit; border-radius: 3px; padding: 0 1px; }
  mark.error { background: var(--error-bg); box-shadow: inset 0 -2px var(--error); }
  mark.warning { background: var(--warn-bg); box-shadow: inset 0 -2px var(--warn); }
  mark.hint { background: var(--hint-bg); }
  ol { list-style: none; padding: 0; margin: 12px 0 0; }
  li { padding: 8px 0; border-bottom: 1px solid var(--line); cursor: pointer; font-size: 15px; }
  li:last-child { border-bottom: 0; }
  li .where { font: 12px "IBM Plex Mono", monospace; color: var(--muted); margin-right: 6px; }
  li .fix { font-weight: 500; }
  li .why { display: block; color: var(--muted); font-size: 14px; }
  .empty { color: var(--muted); padding: 24px 0; text-align: center; }
  footer { margin-top: 28px; color: var(--muted); font-size: 14px; }
  a { color: inherit; }
</style>
</head>
<body>
<main>
  <header>
    <h1>thaiproof</h1>
    <p>ตรวจภาษาไทยก่อนกดส่ง: คำสะกดผิด คำทับศัพท์ คะ/ค่ะ สำนวนแปล และคำที่ฟ้องว่า AI เขียน</p>
  </header>

  <div class="grid">
    <section class="panel">
      <textarea id="text" placeholder="วางข้อความภาษาไทยตรงนี้ เช่น README โพสต์ อีเมล หรือข้อความที่ให้ AI เขียนมา" spellcheck="false"></textarea>
      <div class="bar">
        <button id="sample" type="button">ลองข้อความที่ AI เขียน</button>
        <button id="clear" type="button">ล้าง</button>
        <label><input type="checkbox" id="royin" checked> ทับศัพท์ตามราชบัณฑิตยสภา</label>
        <label><input type="checkbox" id="hints" checked> คำแนะนำเรื่องสำนวน</label>
      </div>
    </section>

    <section class="panel" aria-live="polite">
      <div class="score"><span>กลิ่น AI</span><b id="level">-</b><span id="per"></span></div>
      <div class="counts">
        <span class="pill error" id="c-error">สะกดผิด 0</span>
        <span class="pill warning" id="c-warning">ทับศัพท์ 0</span>
        <span class="pill hint" id="c-hint">สำนวน 0</span>
      </div>
      <div class="preview" id="preview"></div>
      <ol id="list"></ol>
    </section>
  </div>

  <footer>
    ทุกอย่างทำงานในเบราว์เซอร์นี้ ข้อความไม่ได้ส่งไปที่ไหน ·
    ใช้ใน terminal, CI หรือกับ coding agent ได้ที่ <a href="https://github.com/nuttakulsv/thaiproof">github.com/nuttakulsv/thaiproof</a>
  </footer>
</main>

<script type="module">
  import { lint } from "./skills/thaiproof/thaiproof.mjs"

  const SAMPLE = "🚀 ยินดีต้อนรับสู่แอพพลิเคชั่นของเรา! ในยุคดิจิทัลปัจจุบัน ระบบนี้ถูกออกแบบมาเพื่อช่วยให้คุณสามารถทำการจัดการงานของคุณได้อย่างมีประสิทธิภาพและไร้รอยต่อ ไม่ว่าจะเป็นการอัพเดทสถานะงาน หรือการแชร์ไฟล์ให้ทีม คุณก็ทำได้อย่างง่ายดาย ✨\n\nนอกจากนี้ยังมีฟีเจอร์ที่ทรงพลังอีกมากมายที่จะช่วยยกระดับการทำงานของคุณ เพื่อให้มั่นใจว่าข้อมูลของคุณปลอดภัย เราได้ทำการเข้ารหัสทุกอย่าง 🔒 หากมีข้อสงสัยสามารถคลิ๊กที่ลิ้งค์ด้านล่าง หรือติดต่อเราได้ตลอด 24 ชั่วโมงนะค่ะ 💬"
  const $ = (id) => document.getElementById(id)
  const esc = (s) => s.replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c])
  const KEY = "thaiproof:draft"

  function render() {
    const text = $("text").value
    try { localStorage.setItem(KEY, text) } catch {}
    const { problems, stats } = lint(text, { royin: $("royin").checked, hints: $("hints").checked })
    $("level").textContent = stats.aiLevel
    $("level").className = "level-" + stats.aiLevel
    $("per").textContent = stats.thaiChars ? `${stats.aiScore} จุดต่อ 1,000 ตัวอักษร` : ""
    $("c-error").textContent = `สะกดผิด ${stats.errors}`
    $("c-warning").textContent = `ทับศัพท์ ${stats.warnings}`
    $("c-hint").textContent = `สำนวน ${stats.hints}`

    // highlight, most serious first where marks overlap
    const rank = { error: 0, warning: 1, hint: 2 }
    const marks = [...problems].sort((a, b) => rank[a.level] - rank[b.level])
    const taken = new Array(text.length).fill(null)
    for (const p of marks) {
      const span = taken.slice(p.index, p.index + p.length)
      if (span.some(Boolean)) continue
      for (let i = p.index; i < p.index + p.length; i++) taken[i] = p
    }
    let html = "", cur = null, buf = ""
    const flush = () => { if (buf) html += cur ? `<mark class="${cur.level}" title="${esc(cur.message)}">${esc(buf)}</mark>` : esc(buf); buf = "" }
    for (let i = 0; i < text.length; i++) {
      if (taken[i] !== cur) { flush(); cur = taken[i] }
      buf += text[i]
    }
    flush()
    $("preview").innerHTML = html || '<div class="empty">ผลจะขึ้นตรงนี้</div>'

    $("list").innerHTML = problems.length ? problems.map((p, i) => {
      const fix = p.suggestion && p.suggestion.trim() ? `${esc(p.found)} → ${esc(p.suggestion)}` : esc(p.found.trim() || "เว้นวรรค")
      return `<li data-i="${i}"><span class="pill ${p.level}">${esc(p.rule)}</span> <span class="where">บรรทัด ${p.line}</span>` +
        `<span class="fix">${fix}</span><span class="why">${esc(p.message)}</span></li>`
    }).join("") : (text.trim() ? '<div class="empty">ไม่เจออะไร</div>' : "")
    $("list").onclick = (e) => {
      const li = e.target.closest("li")
      if (!li) return
      const p = problems[+li.dataset.i]
      $("text").focus()
      $("text").setSelectionRange(p.index, p.index + p.length)
    }
  }

  let saved = ""
  try { saved = localStorage.getItem(KEY) || "" } catch {}
  $("text").value = saved
  $("text").addEventListener("input", render)
  $("royin").addEventListener("change", render)
  $("hints").addEventListener("change", render)
  $("sample").onclick = () => { $("text").value = SAMPLE; render() }
  $("clear").onclick = () => { $("text").value = ""; render(); $("text").focus() }
  render()
</script>
</body>
</html>
